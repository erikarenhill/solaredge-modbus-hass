
solaredge_modbus:
    name: 'SolarEdge Modbus'
    host: 192.168.1.111
    port: 1502
    scan_interval: 5 #Optional: time in seconds between readings. Recommended value is at fastest 2-3 sec, default 5
    read_meter1: false #Optional: set this to true if you have an external modbus meter connected with RS485 for reading self consumption

utility_meter:
    solar_production_daily:
      source: sensor.solaredge_lifetime_production
      cycle: daily
    solar_production_hourly:
      source: sensor.solaredge_lifetime_production
      cycle: hourly
    solar_production_weekly:
      source: sensor.solaredge_lifetime_production
      cycle: weekly
    solar_production_monthly:
      source: sensor.solaredge_lifetime_production
      cycle: monthly
    
template:
  - sensor:
      - name: "AC Total Current"
        unique_id: solaredge_ac_total_current
        state: "{{ state_attr('sensor.solaredge_modbus', 'ac_total_current') }}"
        unit_of_measurement: 'A'
      - name: "AC Current Phase A"
        unique_id: solaredge_ac_current_phase_a
        state: "{{ state_attr('sensor.solaredge_modbus', 'ac_current_phase_a') }}"
        unit_of_measurement: 'A'
      - name: "AC Current Phase B"
        unique_id: solaredge_ac_current_phase_b
        state: "{{ state_attr('sensor.solaredge_modbus', 'ac_current_phase_b') }}"
        unit_of_measurement: 'A'
      - name: "AC Current Phase C"
        unique_id: solaredge_ac_current_phase_c
        state: "{{ state_attr('sensor.solaredge_modbus', 'ac_current_phase_c') }}"
        unit_of_measurement: 'A'
      - name: "SolarEdge AC Output Voltage (A-B)"
        unique_id: solaredge_ac_voltage_phase_ab
        state: "{{ state_attr('sensor.solaredge_modbus', 'ac_voltage_phase_ab') }}"
        unit_of_measurement: 'V'
      - name: "AC Voltage Phase A"
        unique_id: solaredge_ac_current_voltage_a
        state: "{{ state_attr('sensor.solaredge_modbus', 'ac_voltage_phase_a') }}"
        unit_of_measurement: 'V'
      - name: "AC Voltage Phase B"
        unique_id: solaredge_ac_current_voltage_b
        state: "{{ state_attr('sensor.solaredge_modbus', 'ac_voltage_phase_b') }}"
        unit_of_measurement: 'V'
      - name: "AC Voltage Phase C"
        unique_id: solaredge_ac_current_voltage_c
        state: "{{ state_attr('sensor.solaredge_modbus', 'ac_voltage_phase_c') }}"
        unit_of_measurement: 'V'
      - name: "AC Power Output"
        unique_id: solaredge_ac_power_output
        state: "{{ state_attr('sensor.solaredge_modbus', 'ac_power_output') }}"
        unit_of_measurement: 'W'
      - name: "DC Current"
        unique_id: solaredge_dc_current
        state: "{{ state_attr('sensor.solaredge_modbus', 'dc_current') }}"
        unit_of_measurement: 'A'
      - name: "DC Voltage"
        unique_id: solaredge_dc_voltage
        state: "{{ state_attr('sensor.solaredge_modbus', 'dc_voltage') }}"
        unit_of_measurement: 'V'
      - name: "DC Power Input"
        unique_id: solaredge_dc_power_input
        state: "{{ state_attr('sensor.solaredge_modbus', 'dc_power_input') }}"
        unit_of_measurement: 'W'
      - name: "Inverter Heat sink Temperature"
        unique_id: solaredge_heatsink_temp
        state: "{{ state_attr('sensor.solaredge_modbus', 'heat_sink_temperature') }}"
        unit_of_measurement: '°C'
      - name: "Inverter efficiency"
        unique_id: solaredge_inverter_efficiency
        state: "{{ state_attr('sensor.solaredge_modbus', 'computed_inverter_efficiency') }}"
        unit_of_measurement: '%'
      - name: "AC Frequency"
        unique_id: solaredge_ac_frequency
        state: "{{ state_attr('sensor.solaredge_modbus', 'ac_frequency') }}"
        unit_of_measurement: 'Hz'
      - name: "Lifetime production"
        unique_id: solaredge_lifetime_production
        state: "{{ (state_attr('sensor.solaredge_modbus', 'ac_lifetimeproduction') / 1000.0) | round(2) }}"
        unit_of_measurement: 'kWh'
      - name: "SolarEdge Status"
        unique_id: solaredge_status
        state: >-
          {% if state_attr('sensor.solaredge_modbus', 'status') == 1 %}
            Off
          {% elif state_attr('sensor.solaredge_modbus', 'status') == 2 %}
            Sleep
          {% elif state_attr('sensor.solaredge_modbus', 'status') == 3 %}
            Wake-Up
          {% elif state_attr('sensor.solaredge_modbus', 'status') == 4 %}
            Working
          {% elif state_attr('sensor.solaredge_modbus', 'status') == 5 %}
            Throttled
          {% elif state_attr('sensor.solaredge_modbus', 'status') == 6 %}
            Shut-Down
          {% elif state_attr('sensor.solaredge_modbus', 'status') == 7 %}
            Fault
          {% elif state_attr('sensor.solaredge_modbus', 'status') == 8 %}
            Maintenance
          {% else %}
            Unknown
          {% endif %}
